[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinicflow-eval"
version = "0.1.0"
description = "Behavioural evaluation harness for the clinic-plugin-pack Claude Code plugin: scripted pack-guided vs unguided agent policies on clinical front-desk workflow scenarios, scored on safety endpoints."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Habib Ur Rehman" }]
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
